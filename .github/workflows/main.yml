
name: Build iOS CameraApp

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Download Core ML models
        run: |
          cd code/chapter-11/CameraApp
          chmod +x download-coreml-models.sh
          ./download-coreml-models.sh

      - name: Build iPhone app
        run: |
          cd code/chapter-11/CameraApp
          xcodebuild \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/CameraApp.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/CameraApp.app"
          cd "$RUNNER_TEMP"
          zip -qry CameraApp.ipa Payload

      - name: Save IPA file
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: ${{ runner.temp }}/CameraApp.ipa
          if-no-files-found: error
